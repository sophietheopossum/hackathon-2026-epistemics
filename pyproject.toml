[project]
name = "epistaint"
version = "0.1.0"
description = "Epistemic taint tracking: provenance-tag LLM agent tool calls and audit claims against them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
epistaint-proxy = "epistaint.proxy:main"
epistaint-audit = "epistaint.audit:main"
epistaint-toolbox = "epistaint.toolbox:main"
epistaint-run = "epistaint.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epistaint"]
